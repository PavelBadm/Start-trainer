<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Trainer</title>
<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    font-family:sans-serif;
    color:white;
}

#menu{
    display:flex;
    flex-direction:column;
    gap:3vw;
    align-items:center;
}

.menu-btn{
    padding:4vw 6vw;
    font-size:5vw;
    border-radius:3vw;
}

#status{
    font-size:8vw;
    height:12vh;
    color:#ffaa00;
}

#arena{
    position:relative;
    width:90vw;
    height:90vw;
    max-width:600px;
    max-height:600px;
}

.arrow{
    position:absolute;
    width:28vw;
    height:2.5vw;
    background:#ff7700;
    box-shadow:0 0 5vw #ff3300;
    transform-origin:center center;
    border-radius:1vw;
}

.arrow::after{
    content:'';
    position:absolute;
    right:-4vw;
    top:-3vw;
    border-left:6vw solid #ff7700;
    border-top:4vw solid transparent;
    border-bottom:4vw solid transparent;
}

.arrow-hit{
    position:absolute;
    width:10vw;
    height:3vw;
    background:red;
    border-radius:2vw;
    box-shadow:0 0 6vw red;
}

.arrow-hit::after{
    content:'';
    position:absolute;
    right:-3vw;
    top:-2vw;
    border-left:4vw solid red;
    border-top:3vw solid transparent;
    border-bottom:3vw solid transparent;
}

button{
    padding:4vw 8vw;
    font-size:6vw;
    border-radius:3vw;
}
#controlPanel{
    display:flex;
    flex-direction:column;
    gap:2vh;
    width:80%;
    max-width:300px;
    margin-top:2vh;
}

#controlPanel button{
    width:100%;
    font-size:min(5vw,20px);
}
</style>
</head>
<body>

<div id="menu">
    <button class="menu-btn" data-mode="main">Основной</button>
    <button class="menu-btn" data-mode="defense">Защита от смеша</button>
    <button class="menu-btn" data-mode="diag1">Диагональ (ЛЗ – ПП)</button>
    <button class="menu-btn" data-mode="diag2">Диагональ (ПЗ – ЛП)</button>
    <button class="menu-btn" data-mode="front">Передняя зона</button>
    <button class="menu-btn" data-mode="back">Задняя зона</button>
</div>

<div id="status" style="display:none"></div>
<div id="arena" style="display:none"></div>
<div id="controlPanel" style="display:none">
    <button id="startBtn">Старт</button>
    <button id="backBtn">К режимам</button>
</div>    
<script>
let running=false;
let audioCtx=null;
let currentMode=null;

const arena=document.getElementById("arena");
const startBtn=document.getElementById("startBtn");
const backBtn = document.getElementById("backBtn");
const menu=document.getElementById("menu");
const status=document.getElementById("status");
const controlPanel = document.getElementById("controlPanel");

/* ---- Позиции (визуально те же, углы часовые) ---- */

const positions = [
    {angle:45,  x:"75%", y:"25%"},  // ППУ
    {angle:90,  x:"80%", y:"50%"},  // ППП
    {angle:135, x:"75%", y:"75%"},  // ПЗУ
    {angle:225, x:"25%", y:"75%"},  // ЛЗУ
    {angle:270, x:"20%", y:"50%"},  // ЛПП
    {angle:315, x:"25%", y:"25%"},  // ЛПУ
    {angle:180, x:"50%", y:"50%", hit:true} // В тебя
];

function getPos(angle){
    return positions.find(p=>p.angle===angle);
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function randomBetween(min,max){ return min+Math.random()*(max-min); }

function initAudio(){
    if(!audioCtx){
        audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    }
}

function risingSound(){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(250,audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(700,audioCtx.currentTime+0.6);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.4,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.6);
    osc.start();
    osc.stop(audioCtx.currentTime+0.6);
}

function arrowSound(){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type="sine";
    osc.frequency.value=850;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.4,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);
    osc.start();
    osc.stop(audioCtx.currentTime+0.12);
}

function clearArena(){ arena.innerHTML=""; }

function showArrow(pos){
    clearArena();
    const el=document.createElement("div");
    el.className = pos.hit ? "arrow-hit" : "arrow";
    el.style.left=pos.x;
    el.style.top=pos.y;
    let transform=`translate(-50%, -50%) rotate(${pos.angle - 90}deg)`;
    if(pos.hit) transform+=" scale(0.8)";
    el.style.transform=transform;
    arena.appendChild(el);
}

/* --------- Режимы --------- */

const modes={
    main:{ type:"static", angles:[45,90,135,225,270,315] },
    defense:{ type:"static", angles:[90,270] },
    front:{ type:"static", angles:[45,315] },
    back:{ type:"static", angles:[135,225] },
    diag1:{ type:"diagonal", back:225, front:45 },  // ЛЗ – ПП
    diag2:{ type:"diagonal", back:135, front:315 }  // ПЗ – ЛП
};

/* --------- Генерация --------- */

function generateRound(modeKey, steps){

    const mode=modes[modeKey];
    let round=[];
    let prev=null;

if(mode.type==="static"){

    const angles = mode.angles;
    prev = angles[Math.floor(Math.random()*angles.length)];
    round.push(prev);

    let repeatCount = 1;

    for(let i=1;i<steps;i++){

        let next;

        // ---- СПЕЦИАЛЬНАЯ ЛОГИКА ДЛЯ 2 УГЛОВ ----
        if(angles.length === 2){

            const [a,b] = angles;
            const repeatProb = 0.32; // можно тонко настраивать

            if(prev === a){
                if(Math.random() < repeatProb && repeatCount < 3){
                    next = a;
                } else {
                    next = b;
                }
            } else {
                if(Math.random() < repeatProb && repeatCount < 3){
                    next = b;
                } else {
                    next = a;
                }
            }

        } 
        // ---- ДЛЯ 6-УГЛОВЫХ РЕЖИМОВ ----
        else {

            if(Math.random() < 0.30 && repeatCount < 3){
                next = prev;
            } else {
                const alternatives = angles.filter(a => a !== prev);
                next = alternatives[Math.floor(Math.random()*alternatives.length)];
            }

        }

        if(next === prev){
            repeatCount++;
        } else {
            repeatCount = 1;
        }

        round.push(next);
        prev = next;
    }
}

    if(mode.type==="diagonal"){
        prev = mode.back;
        round.push(prev);

        for(let i=1;i<steps;i++){
            let next;

            if(prev===mode.back){
                const r=Math.random();
                if(r<0.4) next=mode.back;               // повтор задней
                else if(r<0.75) next=mode.front;        // диагональ
                else next=[90,270][Math.floor(Math.random()*2)]; // обрыв
            }else{
                const r=Math.random();
                if(r<0.55) next=mode.back;
                else if(r<0.8) next=mode.front;
                else next=[90,270][Math.floor(Math.random()*2)];
            }

            round.push(next);
            prev=next;
        }
    }

    /* --- гарантированный "в тебя" --- */

    const hitIndex = Math.floor(randomBetween(2,steps-2));
    round[hitIndex]=180;

    return round;
}

/* --------- Серия --------- */

async function startSeries(){

    if(running) return;
    running=true;

    initAudio();
    await audioCtx.resume();

    controlPanel.style.display="none";
    
    const steps=Math.floor(randomBetween(10,15));
    const round=generateRound(currentMode,steps);

    for(let i=0;i<round.length;i++){

        clearArena();
        status.innerText="";

        await sleep(randomBetween(400,1200));

        status.innerText="SPLIT";
        risingSound();

        await sleep(600);
        await sleep(randomBetween(50,150));

        status.innerText="";

        const pos=getPos(round[i]);
        showArrow(pos);
        arrowSound();

        await sleep(800);
        await sleep(randomBetween(500,800));
    }

    clearArena();
    status.innerText="";
    running=false;
    controlPanel.style.display="flex";
}

/* --------- Меню --------- */

document.querySelectorAll(".menu-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
       currentMode=btn.dataset.mode;
       menu.style.display="none";
       arena.style.display="block";
       status.style.display="block";
       controlPanel.style.display="flex";
    });
});

startBtn.addEventListener("click",startSeries);

backBtn.addEventListener("click", ()=>{
    clearArena();
    status.innerText="";
    arena.style.display="none";
    status.style.display="none";
    controlPanel.style.display="none";
    menu.style.display="flex";
});
</script>

</body>
</html>
