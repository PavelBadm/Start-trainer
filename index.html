<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Trainer iPhone</title>
<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    font-family:sans-serif;
    color:white;
}

#status{
    font-size:8vw;           /* было фиксированное */
    height:12vh;
    color:#ffaa00;
}

#arena{
    position:relative;
    width:90vw;              /* адаптивная ширина */
    height:90vw;
    max-width:600px;
    max-height:600px;
}

.arrow{
    position:absolute;
    width:28vw;              /* крупнее */
    height:2.5vw;
    background:#ff7700;
    box-shadow:0 0 5vw #ff3300;
    transform-origin:left center;
    border-radius:1vw;
}

.arrow::after{
    content:'';
    position:absolute;
    right:-4vw;
    top:-3vw;
    border-left:6vw solid #ff7700;
    border-top:4vw solid transparent;
    border-bottom:4vw solid transparent;
}

.centerHit{
    position:absolute;
    width:12vw;
    height:12vw;
    background:red;
    border-radius:50%;
    box-shadow:0 0 6vw red;
    left:39vw;
    top:39vw;
}

button{
    padding:4vw 8vw;
    font-size:6vw;
    border-radius:3vw;
}
</style>
</head>
<body>

<div id="status"></div>
<div id="arena"></div>
<button id="startBtn">Start</button>

<script>
let running=false;
let audioCtx=null;

const arena=document.getElementById("arena");
const startBtn=document.getElementById("startBtn");

const positions=[
    {angle:315,x:"65%",y:"10%"},
    {angle:0,x:"85%",y:"45%"},
    {angle:45,x:"65%",y:"75%"},
    {angle:135,x:"10%",y:"75%"},
    {angle:180,x:"0%",y:"45%"},
    {angle:225,x:"10%",y:"10%"},
    {center:true}
];

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

function randomBetween(min,max){
    return min+Math.random()*(max-min);
}

function randomArrowDelay(){
    const r=Math.random();
    if(r<0.80){
        return randomBetween(50,150);
    }else if(r<0.97){
        return randomBetween(150,250);
    }else{
        return randomBetween(250,400);
    }
}

function initAudio(){
    if(!audioCtx){
        audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    }
}

function risingSound(){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="sine";
    osc.frequency.setValueAtTime(250,audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(700,audioCtx.currentTime+0.6);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    gain.gain.setValueAtTime(0.4,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.6);

    osc.start();
    osc.stop(audioCtx.currentTime+0.6);
}

function arrowSound(){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="sine";
    osc.frequency.value=850;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    gain.gain.setValueAtTime(0.4,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);

    osc.start();
    osc.stop(audioCtx.currentTime+0.12);
}

function clearArena(){
    arena.innerHTML="";
}

function showArrow(pos){
    clearArena();
    if(pos.center){
        const hit=document.createElement("div");
        hit.className="centerHit";
        arena.appendChild(hit);
        return;
    }
    const el=document.createElement("div");
    el.className="arrow";
    el.style.left=pos.x;
    el.style.top=pos.y;
    el.style.transform=`rotate(${pos.angle}deg)`;
    arena.appendChild(el);
}

async function startSeries(){
    if(running) return;
    running=true;

    initAudio();
    await audioCtx.resume();

    startBtn.classList.add("hidden");

    const steps=Math.floor(randomBetween(10,16));

    for(let i=0;i<steps;i++){

        clearArena();
        document.getElementById("status").innerText="";

        await sleep(randomBetween(400,1200));

	document.getElementById("status").innerText="SPLIT";

	risingSound();

        await sleep(600);

        await sleep(randomArrowDelay());

        document.getElementById("status").innerText="";

        const pos=positions[Math.floor(Math.random()*7)];
        showArrow(pos);
        arrowSound();

        await sleep(800);

        // восстановление центра
        await sleep(randomBetween(500,800));
    }

    clearArena();
    document.getElementById("status").innerText="";
    running=false;
    startBtn.classList.remove("hidden");
}

startBtn.addEventListener("click",startSeries);
</script>

</body>
</html>
